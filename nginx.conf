# daba-frontend/nginx.conf
# Serves the built Vite/React SPA and falls back to index.html
# so client-side routes (react-router-dom) work on refresh/deep links.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html itself is never cached
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
